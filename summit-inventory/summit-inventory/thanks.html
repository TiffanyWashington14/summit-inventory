<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanks | Summit Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
<style>
  :root { --black:#0a0a0a; --white:#f9f7f5; --warm:#60564d; --warm-pale:#e8e2db; --mid:#2a2420; }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--mid);color:var(--white);font-family:'Montserrat',sans-serif;
       padding:2rem;text-align:center}
  .eyebrow{font-size:0.62rem;font-weight:700;letter-spacing:0.3em;text-transform:uppercase;color:rgba(249,247,245,0.55)}
  h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(2.4rem,6vw,4rem);line-height:1.05;margin:1.2rem 0 1.4rem}
  h1 em{font-style:italic;color:var(--warm-pale)}
  p{font-size:0.88rem;font-weight:300;line-height:1.9;color:rgba(249,247,245,0.6);max-width:42ch;margin:0 auto 2.5rem}
  a.call{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:300;color:var(--white);text-decoration:none;display:block;margin-bottom:2.2rem}
  a.call:hover{color:var(--warm-pale)}
  a.back{display:inline-flex;align-items:center;gap:0.5rem;padding:0.9rem 2rem;
         border:2px solid rgba(255,255,255,0.4);color:var(--white);text-decoration:none;
         font-size:0.68rem;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;transition:all 0.25s}
  a.back:hover{border-color:var(--white);background:var(--white);color:var(--black)}
</style>
</head>
<body>
  <div>
    <p class="eyebrow">Message Received</p>
    <h1>We'll be <em>in touch.</em></h1>
    <p>Someone from Summit Group will call you back shortly. If you'd rather not wait:</p>
    <a class="call" href="tel:9545940894">954-594-0894</a>
    <a class="back" href="/">Back to the Inventory</a>
  </div>
</body>
</html>
